<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>20Pay Life Calculator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: single centered column — inputs card, then result ledger, then rate breakdown */
:root{
  --bg:#f6f3f2; --surface:#ffffff; --ink:#221a1c; --muted:#6f6366; --line:#e6dfdf;
  --accent:#b3123f; --accent-soft:#f8e4ea; --on-accent:#fff;
  --display:"Anuphan","IBM Plex Sans Thai",system-ui,sans-serif;
  --body:"IBM Plex Sans Thai",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171213; --surface:#211a1c; --ink:#f3ecee; --muted:#a8999d; --line:#3a2f32;
  --accent:#ff5c86; --accent-soft:#3a1d26; --on-accent:#1a0f12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171213; --surface:#211a1c; --ink:#f3ecee; --muted:#a8999d; --line:#3a2f32;
  --accent:#ff5c86; --accent-soft:#3a1d26; --on-accent:#1a0f12; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:560px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
header h1{font-family:var(--display);font-size:1.7rem;line-height:1.2;margin:0;text-wrap:balance}
header p{margin:4px 0 0;color:var(--muted);font-size:.92rem}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:18px}
.field{display:flex;flex-direction:column;gap:8px}
.field>label,.lbl{font-weight:600;font-size:.9rem}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg);padding:4px;border-radius:10px}
.seg button{font:inherit;border:0;border-radius:8px;padding:10px;background:transparent;color:var(--muted);cursor:pointer;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}
select,input[type=text]{font:inherit;font-size:1rem;width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
input[type=text]{font-family:var(--mono);font-variant-numeric:tabular-nums}
select:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font:inherit;font-size:.85rem;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer;font-variant-numeric:tabular-nums}
.chips button:disabled{opacity:.35;cursor:not-allowed}
.chips button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.err{color:var(--accent);font-size:.85rem;margin:0}
.result{background:var(--accent-soft);border-radius:14px;padding:20px 18px;display:flex;flex-direction:column;gap:4px}
.big{font-family:var(--display);font-size:2.4rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--accent)}
.big small{font-size:1rem;font-weight:500;color:var(--ink)}
.result .sub{color:var(--muted);font-size:.9rem}
dl{margin:0;display:grid;grid-template-columns:1fr auto;row-gap:10px;column-gap:16px}
dt{color:var(--muted)}
dd{margin:0;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
dd.strong{font-weight:600;color:var(--ink)}
hr{border:0;border-top:1px solid var(--line);grid-column:1/-1;margin:2px 0;width:100%}
.note{font-size:.8rem;color:var(--muted);margin:0}
input[type=range]{width:100%;accent-color:var(--accent);margin:2px 0 0;cursor:pointer}
.scale{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);margin-top:-6px}
.hint{font-size:.85rem;color:var(--muted);margin:0}
@media (prefers-reduced-motion:no-preference){.big{transition:color .2s}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Anonynowhere</h1>
  </header>

  <section class="card" aria-label="ข้อมูลผู้เอาประกัน">
    <div class="field">
      <label for="plan">แบบประกัน</label>
      <select id="plan">
        <option value="20pl">20Pay Life (Non Par)</option>
      </select>
    </div>
    <div class="field">
      <span class="lbl">เพศ</span>
      <div class="seg" role="group" aria-label="เพศ">
        <button type="button" id="sex-m" aria-pressed="true">ชาย</button>
        <button type="button" id="sex-f" aria-pressed="false">หญิง</button>
      </div>
    </div>
    <div class="field">
      <label for="age">อายุ (ปี)</label>
      <input type="text" id="age" inputmode="numeric" value="35" autocomplete="off">
      <input type="range" id="age-r" min="0" max="70" step="1" value="35" aria-label="สไลด์เลือกอายุ">
      <div class="scale"><span>15 วัน</span><span id="age-max-l">70 ปี</span></div>
      <p class="hint" id="age-hint" hidden>0 = อายุ 15 วัน – ต่ำกว่า 1 ปี</p>
      <p class="err" id="age-err" hidden></p>
    </div>
    <div class="field">
      <label for="sa">ทุนประกัน (บาท)</label>
      <input type="text" id="sa" inputmode="numeric" value="300,000" autocomplete="off">
      <input type="range" id="sa-r" min="100000" max="10000000" step="10000" value="300000" aria-label="สไลด์เลือกทุนประกัน">
      <div class="scale"><span id="sa-min-l">100,000</span><span id="sa-max-l">10,000,000</span></div>
      <div class="chips" id="chips"></div>
      <p class="err" id="err" hidden></p>
    </div>
  </section>

  <section class="result" aria-live="polite">
    <span class="lbl">เบี้ยประกันภัยรายปี</span>
    <div class="big"><span id="premium">22,300</span> <small>บาท</small></div>
    <span class="sub" id="pay-span">ชำระ 20 ปี</span>
  </section>

  <section class="card" aria-label="รายละเอียดการคำนวณ">
    <dl>
      <dt>อัตราเบี้ยมาตรฐาน / ทุน 1,000</dt><dd id="r-rate">–</dd>
      <dt>ส่วนลดตามทุนประกัน / ทุน 1,000</dt><dd id="r-disc">–</dd>
      <dt>อัตราสุทธิ / ทุน 1,000</dt><dd class="strong" id="r-net">–</dd>
      <hr>
      <dt id="l-total">เบี้ยรวมตลอด 20 ปี</dt><dd class="strong" id="r-total">–</dd>
      <dt id="l-cover">ความคุ้มครองชีวิต (ถึงอายุ 99)</dt><dd id="r-cover">–</dd>
      <dt id="l-mat">เงินคืนเมื่อครบอายุ 99</dt><dd id="r-mat">–</dd>
    </dl>
  </section>

  <p class="note" id="note"></p>
</div>

<script>
// [male, female] per 1,000 SA; index 0 = 15 วัน, then ages 1..max
const R20PL=[[12.76,11.47],[12.81,11.47],[12.98,11.51],[13.15,11.58],[13.33,11.68],[13.53,11.80],[13.73,11.94],[13.95,12.10],[14.18,12.27],[14.42,12.45],[14.68,12.66],[14.96,12.87],[15.23,13.09],[15.52,13.32],[15.80,13.56],[16.09,13.76],
[16.38,13.97],[16.67,14.19],[16.97,14.41],[17.27,14.65],[17.58,14.90],[17.90,15.15],[18.23,15.43],[18.57,15.71],[18.93,16.00],[19.31,16.31],[19.70,16.64],[20.12,16.98],[20.56,17.34],[21.02,17.72],[21.50,18.11],[22.01,18.53],[22.55,18.96],[23.11,19.42],[23.69,19.90],[24.30,20.40],
[24.94,20.93],[25.61,21.48],[26.31,22.06],[27.04,22.67],[27.80,23.30],[28.60,23.96],[29.44,24.66],[30.32,25.39],[31.24,26.15],[32.20,26.95],[33.22,27.79],[34.28,28.68],[35.40,29.61],[36.57,30.59],[37.81,31.62],[39.13,32.72],[40.51,33.88],[41.99,35.11],[43.56,36.41],[45.25,37.81],
[47.05,39.29],[48.99,40.89],[51.08,42.60],[53.33,44.44],[55.77,46.43],[58.42,48.59],[61.29,50.93],[64.19,53.49],[66.96,56.27],[69.89,59.32],[71.99,61.90],[73.80,63.61],[75.13,64.71],[76.40,66.13],[78.11,67.07]];
const RPLP={"10":[[24.35,19.37],[24.56,19.6],[24.96,19.97],[25.37,20.33],[25.8,20.71],[26.25,21.11],[26.72,21.52],[27.2,21.93],[27.72,22.39],[28.26,22.84],[28.83,23.31],[29.43,23.8],[30.03,24.31],[30.66,24.84],[31.28,25.38],[31.92,25.95],[32.57,26.53],[33.23,27.13],[33.89,27.75],[34.57,28.4],[35.27,29.07],[35.97,29.78],[36.71,30.5],[37.47,31.25],[38.26,32.03],[39.07,32.85],[39.93,33.69],[40.82,34.57],[41.76,35.5],[42.72,36.45],[43.74,37.44],[44.79,38.49],[45.89,39.57],[47.04,40.7],[48.21,41.88],[49.45,43.1],[50.72,44.37],[52.05,45.71],[53.43,47.09],[54.86,48.53],[56.33,50.03],[57.87,51.28],[59.47,52.58],[61.13,53.93],[62.84,55.33],[64.64,56.78],[66.48,58.3],[68.23,59.86],[69.86,61.49],[71.55,63.15],[73.29,64.74],[75.09,66.38],[76.95,68.09],[78.88,69.86],[80.89,71.7],[82.98,73.61],[85.17,75.59],[87.45,77.65],[89.85,79.8],[92.36,82.04],[95.0,84.39],[97.79,86.86],[100.74,89.46],[103.86,92.22],[107.17,95.15],[110.71,98.28],[114.51,101.64],[118.58,105.23],[122.97,109.1],[127.72,113.26],[132.85,117.73],[138.39,122.53],[144.37,127.68],[150.82,133.2],[157.76,139.12],[165.2,145.44]],"15":[[17.53,15.42],[17.69,15.53],[17.96,15.74],[18.26,15.95],[18.56,16.17],[18.89,16.41],[19.22,16.65],[19.57,16.91],[19.94,17.17],[20.33,17.44],[20.74,17.72],[21.16,18.02],[21.6,18.33],[22.04,18.65],[22.5,18.98],[22.96,19.32],[23.42,19.67],[23.88,20.03],[24.35,20.41],[24.84,20.8],[25.33,21.21],[25.84,21.64],[26.36,22.08],[26.91,22.54],[27.47,23.01],[28.05,23.51],[28.67,24.02],[29.3,24.56],[29.98,25.12],[30.67,25.71],[31.39,26.32],[32.16,26.96],[32.95,27.62],[33.77,28.31],[34.63,29.03],[35.52,29.79],[36.44,30.58],[37.41,31.41],[38.41,32.26],[39.45,33.15],[40.54,34.09],[41.66,35.06],[42.83,36.07],[44.06,37.11],[45.32,38.21],[46.49,39.35],[47.63,40.54],[48.82,41.78],[50.05,43.08],[51.34,44.43],[52.67,45.85],[54.07,47.27],[55.52,48.54],[57.05,49.88],[58.66,51.28],[60.35,52.74],[62.15,54.29],[64.05,55.91],[66.08,57.63],[68.25,59.46],[70.57,61.41],[73.06,63.5],[75.74,65.75],[78.64,68.17],[81.78,70.8],[85.19,73.66],[88.9,76.78],[92.95,80.17],[97.36,83.87],[102.18,87.91],[107.44,92.3],[113.17,97.09],[119.4,102.29],[126.16,107.94],[133.48,114.07],[141.39,120.72]],"20":[[14.8,13.31],[14.86,13.31],[15.06,13.35],[15.25,13.43],[15.46,13.55],[15.69,13.69],[15.93,13.85],[16.18,14.04],[16.45,14.23],[16.73,14.44],[17.03,14.69],[17.35,14.93],[17.67,15.18],[18.0,15.45],[18.33,15.73],[18.66,15.96],[19.0,16.21],[19.34,16.46],[19.69,16.72],[20.03,16.99],[20.39,17.28],[20.76,17.57],[21.15,17.9],[21.54,18.22],[21.96,18.56],[22.4,18.92],[22.85,19.3],[23.34,19.7],[23.85,20.11],[24.38,20.56],[24.94,21.01],[25.53,21.49],[26.16,21.99],[26.81,22.53],[27.48,23.08],[28.19,23.66],[28.93,24.28],[29.71,24.92],[30.52,25.59],[31.37,26.3],[32.25,27.03],[33.18,27.79],[34.15,28.61],[35.17,29.45],[36.24,30.33],[37.35,31.26],[38.54,32.24],[39.76,33.27],[41.06,34.35],[42.2,35.48],[43.4,36.68],[44.66,37.96],[46.0,39.3],[47.41,40.73],[48.92,42.1],[50.53,43.44],[52.26,44.86],[54.12,46.39],[56.12,48.03],[58.29,49.79],[60.64,51.7],[63.2,53.77],[65.97,56.02],[68.99,58.48],[72.29,61.17],[75.89,64.11],[79.81,67.34],[84.11,70.88],[87.15,74.76],[92.04,77.83],[97.53,82.43],[101.92,85.67],[108.33,91.05],[115.3,96.92],[122.85,103.31],[131.01,110.27]]};
const PLANS={
 '20pl':{pay:20,maxAge:70,minSA:100000,maxSA:10000000,rates:R20PL,disc:[[600000,2],[250000,1]],plus:false,
   note:'20Pay Life (Non Par) · ส่วนลด: ทุน 250,000–599,999 ลด 1 บาท, ทุน 600,000 ขึ้นไป ลด 2 บาท ต่อทุน 1,000 · รับประกันอายุ 15 วัน–70 ปี · ทุนขั้นต่ำ 100,000 บาท'},
 'plp10':{pay:10,maxAge:75,minSA:300000,maxSA:9999999,rates:RPLP['10'],disc:[[700000,1.5],[500000,1]],plus:true},
 'plp15':{pay:15,maxAge:75,minSA:300000,maxSA:9999999,rates:RPLP['15'],disc:[[700000,1.5],[500000,1]],plus:true},
 'plp20':{pay:20,maxAge:75,minSA:150000,maxSA:9999999,rates:RPLP['20'],disc:[[700000,1.5],[500000,1]],plus:true}
};
['plp10','plp15','plp20'].forEach(k=>{const p=PLANS[k];p.note=`Pay Life Plus (Non Par) ชำระ ${p.pay} ปี · ส่วนลด: ทุน 500,000–699,999 ลด 1 บาท, ทุน 700,000 ขึ้นไป ลด 1.50 บาท ต่อทุน 1,000 · รับประกันอายุ 15 วัน–75 ปี · ทุน ${fmt0(p.minSA)}–9,999,999 บาท · กรณีเสียชีวิตหรือครบสัญญา จ่ายจำนวนที่มากกว่าระหว่างทุนประกัน เงินค่าเวนคืน หรือเบี้ยที่ชำระมาแล้ว`});
let plan=PLANS['20pl'];
function fmt0(n){return n.toLocaleString('th-TH')}
const PRESETS=[100000,300000,500000,1000000,2000000,5000000];
const $=id=>document.getElementById(id);
const fmt=(n,d=0)=>n.toLocaleString('th-TH',{minimumFractionDigits:d,maximumFractionDigits:d});
let sex=0;
const planSel=$('plan');
function applyPlan(){
  plan=PLANS[planSel.value];
  ageR.max=plan.maxAge;$('age-max-l').textContent=plan.maxAge+' ปี';
  const a=ageIn.value.trim();if(a!==''&&+a<=plan.maxAge)ageR.value=a;
  saR.min=plan.minSA;saR.max=plan.maxSA>=1e7?1e7:9990000;
  $('sa-min-l').textContent=fmt(plan.minSA);$('sa-max-l').textContent=fmt(plan.maxSA);
  const s=+saIn.value.replace(/[^\d]/g,'');if(s)saR.value=clampR(s);
  chips.querySelectorAll('button').forEach(b=>b.disabled=+b.dataset.v<plan.minSA||+b.dataset.v>plan.maxSA);
  $('note').textContent=plan.note+' · เป็นเบี้ยมาตรฐาน ยังไม่รวมการพิจารณารับประกันหรือสัญญาเพิ่มเติม';
  calc();
}

const ageIn=$('age'), ageR=$('age-r');
ageIn.addEventListener('input',()=>{
  const d=ageIn.value.replace(/[^\d]/g,'').slice(0,2);
  ageIn.value=d;
  if(d!==''&&+d<=plan.maxAge)ageR.value=d;
  calc();
});
ageR.addEventListener('input',()=>{ageIn.value=ageR.value;calc()});

const chips=$('chips');
PRESETS.forEach(v=>{const b=document.createElement('button');b.type='button';b.textContent=v>=1e6?(v/1e6)+' ล้าน':(v/1e5)+' แสน';b.dataset.v=v;b.onclick=()=>setSA(v);chips.appendChild(b)});

function setSex(s){sex=s;$('sex-m').setAttribute('aria-pressed',s===0);$('sex-f').setAttribute('aria-pressed',s===1);calc()}
$('sex-m').onclick=()=>setSex(0);$('sex-f').onclick=()=>setSex(1);
const saIn=$('sa'), saR=$('sa-r');
const clampR=v=>Math.min(Math.max(v,+saR.min),+saR.max);
function setSA(v){saIn.value=fmt(v);saR.value=clampR(v);calc()}
saIn.addEventListener('input',()=>{
  const digits=saIn.value.replace(/[^\d]/g,'').slice(0,10);
  saIn.value=digits?fmt(+digits):'';
  if(digits)saR.value=clampR(+digits);
  calc();
});
saR.addEventListener('input',()=>{saIn.value=fmt(+saR.value);calc()});

function discount(sa){for(const [min,d] of plan.disc)if(sa>=min)return d;return 0}

function calc(){
  const sa=+saIn.value.replace(/[^\d]/g,'')||0;
  const ageTxt=ageIn.value.trim();
  const age=ageTxt===''?NaN:+ageTxt;
  chips.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.v===sa));
  $('age-hint').hidden=age!==0;
  const ageBad=!(age>=0&&age<=plan.maxAge), saBad=sa<plan.minSA||sa>plan.maxSA;
  const ae=$('age-err'), err=$('err');
  ae.textContent=`แบบนี้รับประกันอายุ 0–${plan.maxAge} ปี`;ae.hidden=!ageBad;
  err.textContent=sa>plan.maxSA?`ทุนประกันสูงสุด ${fmt(plan.maxSA)} บาท`:`ทุนประกันขั้นต่ำ ${fmt(plan.minSA)} บาท`;err.hidden=!saBad;
  if(ageBad||saBad){
    ['premium','r-rate','r-disc','r-net','r-total','r-cover','r-mat'].forEach(id=>$(id).textContent='–');
    $('pay-span').textContent=ageBad?`กรอกอายุระหว่าง 0–${plan.maxAge} ปี`:err.textContent;return;
  }
  const rate=plan.rates[age][sex], d=discount(sa), net=Math.round((rate-d)*100)/100;
  const prem=Math.round(net*sa/1000*100)/100;
  const showDec=prem%1!==0;
  $('premium').textContent=fmt(prem,showDec?2:0);
  $('r-rate').textContent=fmt(rate,2);
  $('r-disc').textContent=d?'−'+fmt(d,2):'0.00';
  $('r-net').textContent=fmt(net,2);
  $('l-total').textContent=`เบี้ยรวมตลอด ${plan.pay} ปี`;
  $('r-total').textContent=fmt(prem*plan.pay,showDec?2:0)+' บาท';
  const pre=plan.plus?'อย่างน้อย ':'';
  $('r-cover').textContent=pre+fmt(sa)+' บาท';
  $('r-mat').textContent=pre+fmt(sa)+' บาท';
  const start=age===0?'อายุ 15 วัน':'อายุ '+age;
  $('pay-span').textContent=`ชำระ ${plan.pay} ปี (${start} – อายุ ${age+plan.pay-1}) · คุ้มครองถึงอายุ 99`;
}
planSel.addEventListener('change',applyPlan);
applyPlan();
</script>

</body>
</html>
